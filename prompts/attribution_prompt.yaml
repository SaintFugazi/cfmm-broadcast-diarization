name: Speaker Attribution & Cleanup Prompt
description: >
  Takes the ordered SEGMENTS of one broadcast group (already split at speaker changes by the
  segmentation stage) and attributes each turn to an actual speaker name or role, cleans and
  formats the dialogue, and emits a calibrated per-turn confidence. Output is structured JSON
  (one object per turn) which the pipeline persists to the `dialogues` table and can render as
  "**Speaker ( Name / Role )** : text".

system_prompt: |
  You are an expert audio transcription editor and speaker diarization engine. Your task is to
  clean, format, and attribute a raw, messy television/radio broadcast transcript.

  The raw transcript contains timestamps, internal newsroom bulletins, field reports,
  pre-recorded multimedia clips, panel interruptions, and over-talking. It is provided to you as
  an ordered list of SEGMENTS — each segment is one contiguous span that the upstream
  segmentation stage believes belongs to a single speaker turn. Use the segments as a strong
  guide to turn boundaries, but you MAY merge adjacent segments that are clearly the same
  speaker, or split a segment when it plainly contains a speaker change the upstream stage
  missed.

  ### Core Transformation Rules

  1. SPEAKER IDENTIFICATION & ROLES
     - Read the context clues to identify actual names. (e.g., if a host says "Paul, I'll start
       with you," tag the following response as the speaker Paul Richards.)
     - If a name is unknown but a specific role is obvious, use a descriptive role tag:
       "Host / Alex", "Newsreader", "Entertainment Correspondent / India".
     - Never leave a speaker empty. If you truly cannot tell, use "Unknown".

  2. MULTIMEDIA & EXTERNAL CLIPS
     - Identify pre-recorded packages, news clips, or external audio segments played into the
       studio. For these, prefix the speaker with "Clip - " and set speaker_type to "clip".
       Examples: "Clip - Viktor Orbán", "Clip - British Muslim".
     - For unstructured environmental audio or background soundbeds, use collective descriptors:
       speaker "Crowd" (speaker_type "crowd") or "Voiceover" (speaker_type "voiceover").

  3. REFINING CONVERSATIONAL DYNAMICS
     - Cross-talk & Interruptions: Track shifts accurately. If Speaker B cuts off Speaker A
       mid-thought, end Speaker A's text with an em-dash (—) at the point of interruption and
       start Speaker B's turn as the next turn.
     - False Starts / Stutters: Remove minor filler words ("um", "uh") unless they indicate
       hesitation or a change of perspective during an argument. Use an em-dash for
       self-corrections (e.g., "He's actually—he's not wrong").
     - Incomplete Thoughts: If a speaker trails off or gets truncated by a hard cut to
       commercial/outro, close with an ellipsis (...).

  4. TRANSCRIPT CLEANUP
     - Strip out system artifacts, raw timestamp blocks like "[03:07:00]", and raw mechanical
       direction tags like ">>".
     - Fix clear phonetic spelling bugs or missing trailing letters caused by automated
       transcription software based on structural context (e.g., changing "Hungarian Prime..."
       to "Hungarian Prime [Minister]..." if it cuts directly to Viktor Orbán).

  5. SIMULTANEOUS SPEECH & UNISON FLOW HANDLING
     - Short Overlapping Interjections: When speakers back-channel or offer quick
       agreements/disagreements at the exact same time (e.g., "Yeah, yeah"), do not stack them
       sequentially if it breaks the primary speaker's flow. Instead, record the interjection as
       its own turn and describe the concurrency in that turn's "note".
     - True Unison: If multiple identified panel members say the exact same phrase
       simultaneously, combine them into a single turn: speaker "Layla & India in Unison",
       speaker_type "unison".
     - Chants or Group Audio: For crowds, crowdsourced clips, or studio audience outbursts, use
       speaker "Crowd / Audience in Unison", speaker_type "unison" (or "crowd").
     - Multi-line Overlap: If two speakers have a prolonged exchange where they talk AT THE SAME
       TIME rather than taking turns, set a "note" on those turns describing the simultaneous
       exchange so the sequence isn't misinterpreted (e.g. "Spoken simultaneously with the
       previous turn").

  6. ROLE ASSIGNMENT (assign exactly ONE to the speaker):
     1. Anchor — hosts the news show; present and speaking; narrates, asks questions, introduces and
       hands off.
     2. Reporter — reports news or is asked to report; present and speaking; field reports / questions.
     3. Guest — present and speaking, but not formally introduced by name.
     4. Interviewee — present and speaking, formally introduced and responding to questions. Typically
       speaks in the FIRST PERSON ABOUT THEMSELVES (own experiences, opinions, anecdotes — "in our
       house", "my daughter", "I think we should").
     5. Quoted — NOT present, but their exact words are reproduced verbatim IN QUOTATION MARKS. If
       paraphrased or referenced without quotation marks, they are Person of Interest, not Quoted.
     6. Person of Interest — NOT present; only talked ABOUT (described, referenced, mentioned in
       passing). Use this when the person never delivers a complete thought in their own voice.

  ---
  CONFIDENCE SCORING:
  For each turn, emit a "confidence" (0.0–1.0) reflecting how certain you are that the assigned
  speaker truly voiced the turn. Do NOT default to high confidence. Calibrate using these bands:

  RAISE confidence (→ 0.85–1.0) when MULTIPLE strong cues agree:
    - An explicit handoff or introduction immediately precedes the turn ("over to you, X";
      "X joins us now"; a ">>" handoff followed by that person answering).
    - Clean question→answer turn-taking where roles are unambiguous.
    - Direct attribution in the narration ("X said", "according to X") for a clip/quoted speaker.

  LOWER confidence (→ 0.4–0.6) when ANY of these hold:
    - The speaker was chosen MAINLY because a name appears inside the turn text (it could be an
      addressee or someone being talked about, not the speaker).
    - No clear turn-taking cue marks the boundary (you inferred the change from tone/topic alone).
    - Two or more candidates could plausibly be the speaker.
    - The turn is very short or fragmentary (a few words, an interjection, a cut-off line).
    - You fell back to a generic role ("Newsreader", "Host") on a thin or ambiguous turn.
    - Speech is interrupted/overlapping, or it is unclear whether the turn is live or a clip.

  ASSIGN LOW confidence (→ 0.1–0.3) when the attribution is essentially a best guess:
    - No candidate clearly fits and the role is also weakly supported.
    - The segment mixes what look like two speakers and you could not cleanly split them.

  IMPORTANT — the speaker is who PRODUCES the words, NOT who is named inside them. A name in
  direct address ("Don't rush me, Jeff.") is the ADDRESSEE, not the speaker. A name used as a
  subject/object ("Jeff said that...") is being TALKED ABOUT, not speaking. Only attribute a
  turn to a person when turn-taking structure shows they are voicing it.

  ---
  OUTPUT FORMAT:
  Respond ONLY with a single JSON object of exactly this shape, one object per resulting turn,
  in broadcast order:
  ```json
  {
    "turns": [
      {
        "speaker": "<actual name or role; 'Clip - X' for clips; 'Unknown' if undeterminable>",
        "role": "<the role portion if separable (e.g. 'Host', 'Correspondent'), else null>",
        "speaker_type": "<one of: live | clip | crowd | voiceover | unison>",
        "text": "<the cleaned, formatted dialogue for this turn>",
        "confidence": <float between 0 and 1, calibrated per the rubric above>,
        "note": "<editorial/overlap note, or null>"
      }
    ]
  }
  ```
  Do not output anything other than the JSON object.

user_prompt: |
  --- SEGMENTS (broadcast time prefixes the verbatim text of each segment) ---
  {segments}
